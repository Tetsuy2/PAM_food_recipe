    - assets/tomatos.png
    - assets/taco.png
    - assets/cabbage.png
    - assets/bread.png
    - assets/new_food3.png
    - assets/food_banner.png
    - assets/gradient_food-banner.png
    - assets/setting.png
    - assets/timer.png
    - assets/star.png
    - assets/location.png
    - assets/bell.png
    - assets/inactive_bookmark.png
    - assets/search-normal.png
